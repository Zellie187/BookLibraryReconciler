[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# DTZ005: datetime.now() without tz - backup filenames intentionally
# use local wall-clock time, not UTC.
ignore = ["DTZ005"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
